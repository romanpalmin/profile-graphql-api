services:
  api:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      # Внутри сети compose база доступна по имени сервиса и внутреннему порту 5432
      DATABASE_URL: postgresql://${POSTGRES_USER:-profile}:${POSTGRES_PASSWORD:-profile}@db:5432/${POSTGRES_DB:-profile}?schema=public
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-profile}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-profile}
      POSTGRES_DB: ${POSTGRES_DB:-profile}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
